<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Connexion commerciale — Le Binôme Numérique</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* Pied de page collé en bas même quand le contenu est court */
  body { min-height: 100vh; display: flex; flex-direction: column; }
  body > .carte { margin-block: auto; }
</style>
</head>
<body>

<header class="site">
  <div class="container">
    <div class="logo"><a href="index.html" style="color:inherit;"><img src="img/logo-icon.png" alt="" width="68" height="36">Le Binôme Numérique</a></div>
  </div>
</header>

<div class="carte">
  <h2>Espace commercial</h2>
  <p style="color:var(--gris-texte); font-size:.9rem;">Réservé aux commerciaux — page non référencée depuis le site public.</p>

  <form id="form-connexion">
    <div class="champ">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="champ">
      <label>Mot de passe</label>
      <input type="password" id="mot_de_passe" required>
    </div>
    <p style="text-align:right; font-size:.85rem; margin-top:-8px;"><a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a></p>

    <button type="submit" class="btn btn-primaire" style="width:100%;" id="btn-submit">Se connecter</button>
    <div id="zone-message"></div>
  </form>
</div>

<footer class="site">© 2026 Le Binôme Numérique · <a href="cgv.html">CGV</a> · <a href="mentions-legales.html">Mentions légales</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cookie-consent.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/connexion-commercial.js"></script>
<script src="js/animations.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devis Secrétariat Virtuel — Le Binôme Numérique</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .socle-recap { border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; background: #f8f9ff; }
  .socle-recap strong { font-family: var(--font-titres); }
  .option-ligne { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .option-ligne:last-child { border-bottom: none; }
  .option-ligne input { width: auto; margin-top: 3px; }
  .option-ligne .option-detail { flex: 1; }
  .option-ligne .option-prix { font-weight: 700; white-space: nowrap; }
  .option-bientot { color: var(--gris-texte); font-size: .8rem; font-style: italic; }
</style>
</head>
<body>

<header class="site">
  <div class="container">
    <div class="logo"><a href="index.html" style="color:inherit;"><img src="img/logo-icon.png" alt="" width="68" height="36">Le Binôme Numérique</a></div>
  </div>
</header>

<div class="carte au-scroll">
  <h2>Devis Secrétariat Virtuel</h2>
  <p style="color:var(--gris-texte); font-size:.9rem;">
    Décrivez votre besoin, on vous rappelle sous 24h — par téléphone, visio, ou en personne si vous préférez.
  </p>

  <div id="socle-recap" class="socle-recap">Chargement de l'offre...</div>
  <div id="liste-options"></div>

  <form id="form-devis-saas" style="margin-top:20px;">
    <div class="champ">
      <label>Prénom</label>
      <input type="text" id="prenom" required>
    </div>
    <div class="champ">
      <label>Nom</label>
      <input type="text" id="nom" required>
    </div>
    <div class="champ">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="champ">
      <label>Téléphone</label>
      <input type="tel" id="telephone" required>
    </div>
    <div class="champ">
      <label>Budget indicatif</label>
      <select id="budget_indicatif">
        <option value="< 100€/mois">Moins de 100€/mois</option>
        <option value="100-200€/mois">100€ à 200€/mois</option>
        <option value="200€+/mois">Plus de 200€/mois</option>
        <option value="je ne sais pas encore">Je ne sais pas encore</option>
      </select>
    </div>
    <div class="champ" style="display:flex; align-items:center; gap:10px;">
      <input type="checkbox" id="rdv_physique_souhaite" style="width:auto;">
      <label style="margin:0;" for="rdv_physique_souhaite">Je préfère un rendez-vous en personne plutôt qu'à distance</label>
    </div>
    <div class="champ" id="champ-code-postal-rdv" style="display:none;">
      <label>Code postal <small>(pour vous mettre en contact avec un commercial proche de chez vous)</small></label>
      <input type="text" id="code_postal_rdv" pattern="[0-9]{5}" maxlength="5">
    </div>
    <div class="champ">
      <label>Décrivez votre besoin</label>
      <textarea id="message" rows="4" placeholder="Votre métier, votre volume d'emails/appels, vos délais..."></textarea>
    </div>
    <input type="hidden" id="code_affiliation">

    <button type="submit" class="btn btn-primaire" style="width:100%;" id="btn-submit">Envoyer ma demande</button>
    <p style="text-align:center; margin-top:12px;">
      <a href="index.html#reserver">ou réservez directement un appel dans notre agenda →</a>
    </p>
    <div id="zone-message"></div>
  </form>
</div>

<footer class="site">© 2026 Le Binôme Numérique · <a href="cgv.html">CGV</a> · <a href="mentions-legales.html">Mentions légales</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cookie-consent.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/devis-saas.js"></script>
<script src="js/animations.js"></script>
</body>
</html>

  </div>
</header>

<div class="carte au-scroll">
  <h2>Mot de passe oublié</h2>
  <p style="color:var(--gris-texte); font-size:.9rem;">Indiquez votre email, vous recevrez un lien pour définir un nouveau mot de passe.</p>

  <form id="form-oubli">
    <div class="champ">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>

    <button type="submit" class="btn btn-primaire" style="width:100%;" id="btn-submit">Envoyer le lien</button>
    <div id="zone-message"></div>
  </form>

  <p style="text-align:center; margin-top:16px; font-size:.9rem;">
    <a href="connexion.html">Retour à la connexion</a>
  </p>

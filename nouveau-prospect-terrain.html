<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Nouveau prospect — Le Binôme Numérique</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .devis-layout { max-width: 640px; margin: 0 auto; padding: 32px 20px 80px; }
  .devis-retour { display: inline-block; margin-bottom: 18px; font-size: .9rem; }
</style>
</head>
<body>

<header class="site">
  <div class="container">
    <div class="logo"><img src="img/logo-icon.png" alt="" width="68" height="36">Le Binôme Numérique</div>
    <nav id="nav-header"></nav>
  </div>
</header>

<div class="devis-layout">
  <a class="devis-retour" href="prospection-terrain.html">← Retour à mes prospects</a>
  <h2>Nouveau prospect</h2>
  <p class="sous-titre-section">Enregistrez un prospect rencontré sur le terrain — il apparaît ensuite dans votre liste, avec les scripts et argumentaires disponibles pour l'accompagner.</p>

  <form id="form-nouveau-prospect">
    <div class="champ">
      <label for="raison_sociale">Raison sociale <small>(si connue)</small></label>
      <input type="text" id="raison_sociale">
    </div>
    <div class="champ">
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom">
    </div>
    <div class="champ">
      <label for="nom">Nom</label>
      <input type="text" id="nom">
    </div>
    <div class="champ">
      <label for="email">Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="champ">
      <label for="telephone">Téléphone</label>
      <input type="tel" id="telephone">
    </div>
    <div class="champ">
      <label for="interet">Intéressé(e) par</label>
      <select id="interet">
        <option value="saas">Le secrétariat virtuel (SaaS)</option>
        <option value="site_web">Un site web</option>
        <option value="les_deux">Les deux</option>
      </select>
    </div>
    <div class="champ">
      <label for="budget_indicatif">Budget indicatif <small>(optionnel)</small></label>
      <input type="text" id="budget_indicatif" placeholder="Ex : 100-200€/mois">
    </div>
    <div class="champ">
      <label for="message">Notes de visite</label>
      <textarea id="message" rows="4" placeholder="Contexte, besoin exprimé, prochaine étape..."></textarea>
    </div>
    <button type="submit" class="btn btn-primaire" id="btn-submit">Enregistrer le prospect</button>
    <p id="zone-message"></p>
  </form>
</div>

<footer class="site">© 2026 Le Binôme Numérique · <a href="cgv.html">CGV</a> · <a href="mentions-legales.html">Mentions légales</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cookie-consent.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/nouveau-prospect-terrain.js"></script>
</body>
</html>

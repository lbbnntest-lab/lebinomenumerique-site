<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Le Binôme Numérique</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="container">
    <div class="logo"><a href="index.html" style="color:inherit;"><img src="img/logo-icon.png" alt="" width="68" height="36">Le Binôme Numérique</a></div>
  </div>
</header>

<div class="carte au-scroll">
  <h2>Créer votre compte</h2>
  <p style="color:var(--gris-texte); font-size:.9rem;">14 jours d'essai gratuit, sans engagement.</p>

  <form id="form-inscription">
    <div class="champ">
      <label>Vous êtes</label>
      <select id="type_compte" required>
        <option value="B2B">Un professionnel (entreprise, artisan, indépendant)</option>
      </select>
    </div>

    <div id="champs-b2b" class="hidden">
      <div class="champ">
        <label>Raison sociale</label>
        <input type="text" id="raison_sociale">
      </div>
      <div class="champ">
        <label>SIRET (14 chiffres)</label>
        <input type="text" id="siret" pattern="[0-9]{14}" maxlength="14">
      </div>
      <div class="champ">
        <label>Secteur d'activité</label>
        <input type="text" id="secteur_activite" placeholder="Plomberie, conseil, artisanat...">
      </div>
    </div>

    <div class="champ">
      <label>Prénom</label>
      <input type="text" id="prenom" required>
    </div>
    <div class="champ">
      <label>Nom</label>
      <input type="text" id="nom" required>
    </div>
    <div class="champ">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="champ">
      <label>Mot de passe</label>
      <input type="password" id="mot_de_passe" minlength="8" required>
    </div>
    <div class="champ">
      <label>Téléphone</label>
      <input type="tel" id="telephone">
    </div>
    <div class="champ">
      <label>Code d'affiliation commercial <small>(optionnel)</small></label>
      <input type="text" id="code_affiliation">
    </div>

    <input type="hidden" id="plan" value="">

    <div class="champ">
      <label>Cycle de facturation</label>
      <select id="cycle_facturation" required>
        <option value="mensuel">Mensuel</option>
        <option value="trimestriel">Trimestriel (5 % de remise)</option>
        <option value="annuel">Annuel (2 mois offerts)</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primaire" style="width:100%;" id="btn-submit">Continuer vers le paiement</button>
    <div id="zone-message"></div>
  </form>
</div>

<footer class="site">© 2026 Le Binôme Numérique · <a href="cgv.html">CGV</a> · <a href="mentions-legales.html">Mentions légales</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cookie-consent.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/chatbot-widget.js"></script>
<script src="js/animations.js"></script>
</body>
</html>

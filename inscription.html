<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription — Le Binôme Numérique</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/wizard.css">
</head>
<body>

<header class="site">
  <div class="container">
    <div class="logo"><a href="index.html" style="color:inherit;"><img src="img/logo-icon.png" alt="" width="68" height="36">Le Binôme Numérique</a></div>
  </div>
</header>

<div class="wiz">
  <form id="form-inscription" data-wizard data-titre="Créer votre compte" data-cta="Continuer vers le paiement">
    <div class="wiz-carte">
      <div class="wiz-tete"></div>

      <!-- Étape 1 — Votre abonnement -->
      <section class="wiz-step" data-titre="Votre abonnement">
        <p class="wiz-sous">Sans engagement, résiliable en 2 clics depuis votre espace client.</p>
        <input type="hidden" id="plan" value="">
        <div id="wiz-offre-resume" style="background:var(--bleu-clair); border-radius:10px; padding:14px 16px; font-size:.95rem; color:var(--bleu-nuit); margin-bottom:16px;"></div>
        <div class="champ" id="champ-briques" style="display:none;">
          <label>Options sélectionnées</label>
          <p id="briques-recap" style="color:var(--gris-texte); font-size:.88rem; margin:0;"></p>
        </div>
        <div class="champ">
          <label for="cycle_facturation">Cycle de facturation</label>
          <select id="cycle_facturation" data-recap="Facturation" required>
            <option value="mensuel">Mensuel</option>
            <option value="trimestriel">Trimestriel (5 % de remise)</option>
            <option value="annuel">Annuel (2 mois offerts)</option>
          </select>
        </div>
      </section>

      <!-- Étape 2 — Votre entreprise -->
      <section class="wiz-step" data-titre="Votre entreprise">
        <div class="champ">
          <label for="raison_sociale">Raison sociale</label>
          <input type="text" id="raison_sociale" data-recap="Entreprise">
        </div>
        <div class="champ">
          <label for="siret">SIRET <small>(14 chiffres)</small></label>
          <input type="text" id="siret" pattern="[0-9]{14}" maxlength="14" required>
        </div>
        <div class="champ">
          <label for="secteur_activite">Secteur d'activité</label>
          <input type="text" id="secteur_activite" placeholder="Plomberie, conseil, artisanat..." required data-recap="Secteur">
        </div>
      </section>

      <!-- Étape 3 — Votre compte -->
      <section class="wiz-step" data-titre="Votre compte">
        <div class="champ">
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" required>
        </div>
        <div class="champ">
          <label for="nom">Nom</label>
          <input type="text" id="nom" required>
        </div>
        <div class="champ">
          <label for="fonction">Fonction <small>(optionnel)</small></label>
          <input type="text" id="fonction" placeholder="Gérant, Responsable RH...">
        </div>
        <div class="champ">
          <label for="email">Email</label>
          <input type="email" id="email" required data-recap="Email">
        </div>
        <div class="champ">
          <label for="mot_de_passe">Mot de passe <small>(8 caractères minimum)</small></label>
          <input type="password" id="mot_de_passe" minlength="8" required>
        </div>
        <div class="champ">
          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" required>
        </div>
        <details class="wiz-optionnel">
          <summary>Code d'affiliation commercial (optionnel)</summary>
          <div class="champ">
            <label for="code_affiliation">Code d'affiliation</label>
            <input type="text" id="code_affiliation">
          </div>
        </details>
      </section>

      <!-- Étape 4 — Récapitulatif -->
      <section class="wiz-step" data-titre="Récapitulatif" data-recap>
        <p class="wiz-sous">Vérifiez votre inscription avant le paiement sécurisé.</p>
        <div class="wiz-recap" data-wiz-recap></div>
      </section>

      <div class="wiz-nav"></div>
      <div class="wiz-msg" id="zone-message"></div>
      <p class="wiz-secure">Paiement sécurisé par Stripe. Sans engagement.</p>
    </div>
  </form>
</div>

<footer class="site">© 2026 Le Binôme Numérique · <a href="cgv.html">CGV</a> · <a href="mentions-legales.html">Mentions légales</a></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/cookie-consent.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/wizard.js"></script>
<script src="js/auth.js"></script>
<script src="js/chatbot-widget.js"></script>
</body>
</html>
